apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-lb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-lb
  template:
    metadata:
      labels:
        app: web-lb
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
---
apiVersion: v1
kind: Service
metadata:
  name: svc-lb
spec:
  type: LoadBalancer
  selector:
    app: web-lb
  ports:
  - port: 80
    targetPort: 80
